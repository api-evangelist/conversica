docs: https://help.conversica.com/hc/en-us/articles/360048601712-Conversica-API-Integration-Manual
format: http-status
rfc9457: false
description: >-
  Conversica publishes a short status-code table for its ingest endpoint and a
  status/message acknowledgement envelope for the Website Chat lead-creation webhook. There
  is no problem+json media type, no error type URIs, no machine-readable error codes and no
  error body schema for the ingest endpoint. What follows is exactly what is documented,
  plus the error envelope OBSERVED on the live endpoint on 2026-08-13 - the ingest endpoint
  does return a JSON body, which the documentation does not mention. No error catalogue has
  been invented to fill the gap.
envelope:
  ingest:
    body_documented: false
    body_observed: true
    media_type: application/json; charset=utf-8
    signal: HTTP status code plus an undocumented JSON body
    observed_fields:
    - name: message
      type: string
      description: Human-readable failure message. Present on every observed error response.
    - name: status
      type: boolean
      description: >-
        Observed as false on the 405 response. Note this is a BOOLEAN, and is a different
        field from the Website Chat ack envelope's status, which is the HTTP code as a
        STRING - the two envelopes are not the same shape.
      note: not observed on the 401 response, so it is not reliably present
    observed_examples:
    - http_status: 405
      body: '{"message":"GET method is not allowed for this resource. The following methods are available: POST","status":false}'
    - http_status: 401
      body: '{"message":"Invalid username or password. Additional failed attempts may result in your account being locked or your IP address being banned."}'
      headers:
        www-authenticate: Basic realm="Conversica"
    probed: '2026-08-13'
    caution: >-
      The observed body shape is undocumented and therefore uncontracted - Conversica has
      published no schema for it and may change it without notice. Consumers should branch
      on the HTTP status, not on the body.
  webhook_ack:
    media_type: application/json
    schema: openapi/conversica-integrations-api-openapi.yml#/components/schemas/WebhookAck
    fields:
      - name: status
        type: string
        description: HTTP status code rendered as a string.
      - name: message
        type: string
        description: Human-readable result message.
problems:
  - status: 400
    title: Bad Request
    detail: The request could not be understood due to an error.
    source_operation: openapi/conversica-integrations-api-openapi.yml#postLead
    remediation: >-
      Validate the JSON body against the Lead schema. Confirm every required key is present
      (apiVersion, id, conversationId, firstName, email, leadSource, repName), that datetime
      values are UTC RFC 3339 and that boolean values are true or false.
  - status: 401
    title: Unauthorized
    detail: The request could not be processed due to authentication.
    source_operation: openapi/conversica-integrations-api-openapi.yml#postLead
    observed_body: '{"message":"Invalid username or password. Additional failed attempts may result in your account being locked or your IP address being banned."}'
    observed_headers:
      www-authenticate: Basic realm="Conversica"
    remediation: >-
      Confirm the HTTP Basic credentials issued by your Conversica technical account
      manager are being sent, that the username meets the five-character minimum, and that
      the request is over HTTPS. Do NOT retry a failed credential in a loop - the observed
      401 body warns that repeated failures can lock the account or ban the source IP.
  - status: 405
    title: Method Not Allowed
    detail: >-
      Observed, not documented. Any method other than POST on /json/ returns 405 with an
      Allow: POST header and a JSON body.
    source_operation: openapi/conversica-integrations-api-openapi.yml#postLead
    observed_body: '{"message":"GET method is not allowed for this resource. The following methods are available: POST","status":false}'
    observed_headers:
      allow: POST
    probed: '2026-08-13'
    remediation: Use POST. The ingest endpoint exposes no readable resource at /json/.
  - status: 400
    title: Invalid request data
    detail: Returned by the customer's Website Chat lead-creation endpoint when payload validation fails.
    source_operation: openapi/conversica-integrations-api-openapi.yml#receiveChatLead
    envelope: webhook_ack
    example: examples/conversica-chat-webhook-ack.json
    documented_message_example: 'Missing required field: email'
    remediation: Return status "400" with a message naming the missing or invalid field.
  - status: 401
    title: Invalid credentials
    detail: Returned by the customer's Website Chat lead-creation endpoint when Basic auth fails.
    source_operation: openapi/conversica-integrations-api-openapi.yml#receiveChatLead
    envelope: webhook_ack
  - status: 500
    title: Internal Server Error
    detail: Returned by the customer's Website Chat lead-creation endpoint when an error occurred on the server.
    source_operation: openapi/conversica-integrations-api-openapi.yml#receiveChatLead
    envelope: webhook_ack
gaps:
  - No application-level error codes or error identifiers are published.
  - No 403, 404, 409, 422, 429 or 5xx behaviour is documented for POST /json/.
  - >-
    The ingest endpoint returns a JSON error body that the documentation never mentions and
    never schemas, and its `status` field is a boolean where the Website Chat ack envelope's
    `status` is an HTTP code as a string. Two envelopes, one field name, two types.
  - No retry or backoff guidance is published for either direction.
  - >-
    Delivery failure semantics are surfaced operationally rather than as API errors -
    undeliverable leads land in the Unworkable and Lead Stopped conversation stages (see
    vocabulary/conversica-conversation-vocabulary.yml).
