apis:
- aid: conversica:integrations-api
  name: Conversica Integrations API
  description: >-
    JSON-over-HTTPS integration surface for the Conversica Platform. A customer system posts
    Lead objects to a single Conversica endpoint using HTTP Basic authentication, and
    Conversica posts Message objects, Lead Update objects and optional Website Chat
    lead-creation payloads back to endpoints the customer provides. Credentials are issued
    by a Conversica technical account manager and applications must be approved by
    Conversica before they are enabled.
  humanURL: https://help.conversica.com/hc/en-us/sections/360012154451-Conversica-API
