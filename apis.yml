aid: conversica
name: Conversica
description: >-
  Conversica is an AI conversation automation company - "The Conversation Company" - whose
  Revenue Digital Assistants and AI Agents hold two-way, natural-language conversations
  with leads and customers over email, SMS and website chat to generate demand, answer
  questions and drive renewals. Founded in 2007 as AutoFerret.com and renamed Conversica in
  2014, the San Mateo company serves automotive, sports and entertainment, hospitality,
  higher education and enterprise teams, and says its platform has powered more than 1.5
  billion conversations for 2,000+ teams. Its integration surface is the Conversica
  Integrations API - a JSON-over-HTTPS, Basic-authenticated endpoint that ingests Lead
  objects, plus provider-initiated Message, Lead Update and Website Chat lead-creation
  webhooks delivered to endpoints the customer hosts - alongside packaged connectors for
  Salesforce, HubSpot, Marketo, Eloqua, Pardot, Microsoft Dynamics and automotive CRMs.
